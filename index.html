<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TraXall Tools Handleidingen</title>

<style>
    body,
    html {
        min-height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #213153;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 30px 20px;
        box-sizing: border-box;
    }

    .wrapper {
        width: 100%;
        max-width: 1400px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .header-bar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 92px;
        padding: 18px 28px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 2px 2px 10px rgba(0,0,0,0.18);
    }

    .header-bar img.logo {
        position: absolute;
        left: 28px;
        max-width: 180px;
        max-height: 58px;
        width: auto;
        height: auto;
    }

    .header-bar h1 {
        margin: 0;
        color: #213153;
        font-size: 28px;
    }

    .tools-back-link {
        position: absolute;
        right: 28px;
        color: #213153;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
    }

    .tools-back-link:hover {
        text-decoration: underline;
    }

    .content-panel {
        background: white;
        border-radius: 10px;
        padding: 40px;
        box-shadow: 2px 2px 10px rgba(0,0,0,0.18);
        text-align: center;
    }

    .content-panel h2 {
        margin-top: 0;
        color: #213153;
        font-size: 36px;
    }

    .content-panel p {
        font-size: 22px;
        color: #213153;
        font-weight: bold;
        margin-bottom: 40px;
    }

    .troll-wheel {
        display: block;
        width: 125px;
        height: auto;
        margin: 0 auto 30px auto;
    }

    .bills-ugh {
        display: block;
        width: 450px;
        max-width: 90%;
        height: auto;
        margin: 0 auto;
    }

    @media (max-width: 768px) {

        .header-bar {
            min-height: 120px;
        }

        .header-bar img.logo {
            max-width: 130px;
        }

        .header-bar h1 {
            font-size: 22px;
        }

        .tools-back-link {
            font-size: 12px;
        }

        .bills-ugh {
            width: 300px;
        }
    }
</style>
</head>
<body>

<div class="wrapper">

    <div class="header-bar">
        <img src="logo-traxall.png" alt="TraXall Logo" class="logo">

        <h1>Handleidingen</h1>

    <div class="content-panel">

        <h2>UNDER CONSTRUCTION</h2>

        <p>
            Hier komen binnenkort alle handleidingen te staan,<br>
            nog even geduld!
        </p>

        <img src="troll-wheel.gif"
             alt="Under Construction"
             class="troll-wheel">

        <img src="bills-ugh.gif"
             alt="Bills Ugh"
             class="bills-ugh">

    </div>

</div>

</body>
</html>
